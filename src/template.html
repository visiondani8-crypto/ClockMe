<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ClockMe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, light grey canvas, a dark "card" hero, white nested cards, floating black pill tab bar. */
:root{
  --bg:#E8E8EA; --panel:#F6F6F7; --card:#FFFFFF; --line:#E4E4E7; --track:#ECECEF;
  --text:#161617; --muted:#86868C; --ink:#161617; --on-ink:#FFFFFF; --bar:#2A2A2C; --bar2:#3A3A3D;
  --green:#2DB52D; --green-soft:#DDF5DD; --red:#E5484D; --red-soft:#FCE3E4; --orange:#F07F22; --blue:#4A6CF7;
  --hero1:#2D2D30; --hero2:#111113;
  --font:"Plus Jakarta Sans", -apple-system, "SF Pro Text", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0B; --panel:#151517; --card:#1D1D20; --line:#2A2A2E; --track:#2A2A2E;
    --text:#F4F4F5; --muted:#8E8E95; --ink:#F4F4F5; --on-ink:#0A0A0B; --bar:#D9D9DE; --bar2:#BDBDC3;
    --green-soft:#173A17; --red-soft:#3A1718; --hero1:#2A2A2E; --hero2:#121214; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0B; --panel:#151517; --card:#1D1D20; --line:#2A2A2E; --track:#2A2A2E;
  --text:#F4F4F5; --muted:#8E8E95; --ink:#F4F4F5; --on-ink:#0A0A0B; --bar:#D9D9DE; --bar2:#BDBDC3;
  --green-soft:#173A17; --red-soft:#3A1718; --hero1:#2A2A2E; --hero2:#121214; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;min-height:100%;padding:12px 18px 120px;position:relative}
body.locked{overflow:hidden}
h1{font-size:27px;font-weight:700;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;font-weight:600;margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.ico{width:20px;height:20px;stroke-width:1.9}
.ico-sm{width:15px;height:15px;stroke-width:2.2}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.iconbtn:active{background:var(--track)}

/* Header */
.hello small{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.hello h1{font-size:24px;font-weight:600}

/* Hero */
.hero{border-radius:28px;padding:18px 14px 18px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--hero1),var(--hero2));box-shadow:0 14px 30px -12px rgba(0,0,0,.45)}
.hero:before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,255,255,.05);border-radius:22px;pointer-events:none}
.hero:after{content:"";position:absolute;left:22px;right:22px;top:-26px;height:60px;border-left:1px solid rgba(255,255,255,.05);border-right:1px solid rgba(255,255,255,.05);border-radius:0 0 18px 18px;pointer-events:none}
.hero-top{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.08);font-size:13px;font-weight:600;max-width:100%}
.chip .tag{width:18px;height:12px;border-radius:3px;background:var(--green);flex:none}
.chip .tag.pulse{animation:pulse 1.1s ease-in-out infinite alternate}
.chip .tag.orange{background:var(--orange)}
@keyframes pulse{to{opacity:.3}}
.hero-label{font-size:13px;color:rgba(255,255,255,.55);margin-top:10px}
.amount{font-size:40px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.amount .dim{color:rgba(255,255,255,.42)}
.hero-cap{font-size:12px;font-weight:500;color:rgba(255,255,255,.5)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;position:relative}
.act{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;color:rgba(255,255,255,.72)}
.act .ball{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#1A1A1C;
  background:linear-gradient(180deg,#F7F7F8,#BDBDC2);box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.9);transition:transform .15s}
.act:active .ball{transform:scale(.92)}
.act[disabled]{opacity:.35;pointer-events:none}

/* Cards */
.panel{background:var(--panel);border-radius:22px;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.tile{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.tile.lg{width:54px;height:54px;border-radius:16px}
.tile.lg .ico{width:26px;height:26px}
.chev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);flex:none}
.progress{height:6px;border-radius:9px;background:var(--track);overflow:hidden}
.progress i{display:block;height:100%;border-radius:9px;min-width:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--panel);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat b{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--muted)}
.link{font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:3px}
.goal{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%}
.goal-title{font-size:16px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal .card{display:flex;flex-direction:column;gap:10px}
.small{font-size:13px}
.xs{font-size:12px}

/* Shift rows */
.shift{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;width:100%;text-align:left}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--track);display:grid;place-items:center;position:relative;flex:none}
.avatar .up{position:absolute;right:-2px;bottom:-2px;width:17px;height:17px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;border:2px solid var(--card)}
.avatar .up svg{width:9px;height:9px;stroke-width:3.5}
.shift .mid{flex:1;min-width:0}
.shift .mid b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift .mid span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shift .right{text-align:right;flex:none}
.shift .right b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.shift .right span{font-size:12px;color:var(--muted)}
.shift .right span.g{color:var(--green)}
.shift.fut{border-style:dashed;background:transparent}
.shift.fut .right b{color:var(--muted)}
.shift .right span.sched{color:var(--blue);font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}

/* Empty */
.empty{background:var(--panel);border-radius:22px;padding:24px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty p{margin:0;font-size:14px;color:var(--muted);max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--on-ink);border-radius:99px;padding:11px 18px;font-weight:600;font-size:15px}
.btn.big{width:100%;height:58px;font-size:17px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
.btn.ghost{background:var(--panel);color:var(--text)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* Tab bar */
.tabbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:99px;background:var(--tab-bg,#0E0E10);border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 30px -8px rgba(0,0,0,.4);z-index:20}
.tabbar button{position:relative;z-index:1;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:var(--tab-fg,rgba(255,255,255,.8));transition:background .25s,color .25s}
.tabbar button.on{color:var(--tab-on-fg,#000)}
.tab-ind{position:absolute;left:6px;top:6px;width:54px;height:54px;border-radius:50%;background:var(--tab-on-bg,#fff);transition:transform .45s cubic-bezier(.34,1.4,.5,1);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tabbar .ico{width:21px;height:21px}

/* Chart */
.chart{position:relative;height:190px;display:flex;flex-direction:column}
.chart .grid{position:absolute;inset:0 0 24px 0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.chart .grid i{height:1px;background:var(--line)}
.bars{flex:1;display:flex;align-items:flex-end;gap:var(--gap,12px);position:relative}
.barcol{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bar{width:100%;border-radius:99px;background:repeating-linear-gradient(135deg,var(--bar) 0 5px,var(--bar2) 5px 6.5px);transition:opacity .2s,height .35s}
.bar.zero{background:var(--track)}
.bars.sel .barcol:not(.on) .bar{opacity:.4}
.tip{font-size:10px;font-weight:600;background:var(--ink);color:var(--on-ink);padding:3px 6px;border-radius:99px;white-space:nowrap}
.labels{display:flex;gap:var(--gap,12px);height:24px;align-items:flex-end}
.labels span{flex:1;text-align:center;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.labels span.on{color:var(--text);font-weight:600}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.navper{display:flex;align-items:center;justify-content:space-between}
.round{width:38px;height:38px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.round[disabled]{opacity:.3;pointer-events:none}
.darkcard{border-radius:26px;padding:18px;color:#fff;background:linear-gradient(180deg,var(--hero1),var(--hero2));display:flex;flex-direction:column;gap:14px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mini span{font-size:12px;color:rgba(255,255,255,.55)}
.delta{display:inline-flex;align-items:center;gap:4px;padding:4px 9px 4px 4px;border-radius:99px;font-size:13px;font-weight:600;background:var(--green-soft);color:var(--green)}
.delta i{width:17px;height:17px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.delta i svg{width:10px;height:10px;stroke-width:3.5}
.delta.down{background:var(--red-soft);color:var(--red)}
.delta.down i{background:var(--red)}
.lines{display:flex;flex-direction:column;gap:10px}
.line{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.line span:first-child{color:var(--muted)}
.line.ind span:first-child{padding-left:10px}
.line.b span{font-weight:600;color:var(--text)!important}
.line .g{color:var(--green)}
.line .r{color:var(--red)}
hr{border:0;border-top:1px solid var(--line);margin:2px 0}

/* Filter chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:99px;background:var(--panel);font-size:14px;font-weight:500;white-space:nowrap}
.fchip i{width:8px;height:8px;border-radius:50%}
.fchip.on{background:var(--ink);color:var(--on-ink)}

/* Settings groups */
.glabel{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-left:4px;margin-bottom:8px}
.group{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:4px 12px}
.item{display:flex;align-items:center;gap:12px;min-height:54px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .sq{width:38px;height:38px;border-radius:11px;background:var(--track);display:grid;place-items:center;flex:none}
.item .sq .ico{width:17px;height:17px}
.item .t{flex:1}
.item .d{color:var(--muted);font-size:14px}

/* Sheets & forms */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;justify-content:center;align-items:flex-end}
.overlay.anim{animation:fade .22s ease-out}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:440px;height:94%;border-radius:22px 22px 0 0;display:flex;flex-direction:column}
.overlay.anim .sheet{animation:up .38s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h b{font-size:16px;font-weight:600}
.sheet-h button{font-size:16px}
.sheet-h .save{justify-self:end;font-weight:700}
.sheet-h .save[disabled]{opacity:.35}
.sheet-b{overflow-y:auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:18px}
.fsec{display:flex;flex-direction:column;gap:6px}
.fsec>label.h{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-left:4px}
.fsec .foot{font-size:12px;color:var(--muted);padding:0 4px;line-height:1.45}
.fgroup{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f>span{flex:none}
.f input,.f select{font:inherit;color:var(--text);background:transparent;border:0;text-align:right;min-width:0;flex:1;padding:10px 0}
.f input.full{text-align:left}
.f .unit{color:var(--muted)}
.f .hint{font-size:12px;color:var(--green);white-space:nowrap}
.f input[type="number"]{max-width:110px}
.f input.pct{max-width:56px}
textarea{font:inherit;color:var(--text);background:transparent;border:0;width:100%;min-height:70px;padding:12px 0;resize:vertical}
.toggle{position:relative;width:51px;height:31px;flex:none}
.toggle input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.toggle i{position:absolute;inset:0;border-radius:99px;background:var(--track);transition:background .2s}
.toggle i:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle input:checked+i{background:var(--green)}
.toggle input:checked+i:after{transform:translateX(20px)}
.preview .line span:first-child{color:var(--muted)}
.warn{display:flex;gap:8px;align-items:flex-start;background:#FFF4E5;color:#8A4B00;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:8px;line-height:1.4}
:root[data-theme="dark"] .warn,:root[data-theme="darkpink"] .warn{background:#3A2A12;color:#F5C27A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .warn{background:#3A2A12;color:#F5C27A}}
.warn svg{flex:none;margin-top:1px}
.danger{color:var(--red);font-weight:600;text-align:center;width:100%;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.icongrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:12px 0}
.icongrid button{aspect-ratio:1;border-radius:12px;background:var(--track);display:grid;place-items:center}
.colors{display:flex;justify-content:space-between;padding:12px 0}
.colors button{width:30px;height:30px;border-radius:50%;outline-offset:3px}
.colors button.on{outline:2.5px solid var(--text)}
.special{border-bottom:1px solid var(--line);padding:6px 0}
.special .f{border-bottom:0;min-height:40px}

/* Dialog */
.dlg{width:100%;max-width:440px;padding:10px;display:flex;flex-direction:column;gap:8px}
.overlay.anim .dlg{animation:up .3s cubic-bezier(.16,1,.3,1)}
.dlg .box{background:var(--card);border-radius:16px;overflow:hidden}
.dlg .ttl{padding:14px;text-align:center;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line)}
.dlg .ttl b{display:block;color:var(--text);font-size:15px;margin-bottom:3px}
.dlg .box button{display:block;width:100%;padding:16px;font-size:17px;border-bottom:1px solid var(--line);font-weight:500}
.dlg .box button:last-child{border-bottom:0}
.dlg .box button.danger-t{color:var(--red)}
.dlg .cancel{background:var(--card);border-radius:16px;padding:16px;font-size:17px;font-weight:700;width:100%}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;animation:toastIn .4s cubic-bezier(.16,1,.3,1);white-space:nowrap;box-shadow:0 10px 24px -10px rgba(0,0,0,.45);max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{transform:translate(-50%,16px) scale(.96);opacity:.2}}

/* Page header (pushed screens) */
.phead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;margin:-4px -6px 0}
.phead b{text-align:center;font-size:17px;font-weight:600}
.bottomcta{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;width:calc(100% - 36px);max-width:404px;z-index:20}

/* Onboarding */
.ob{max-width:440px;margin:0 auto;min-height:100%;padding:16px 22px 24px;display:flex;flex-direction:column;gap:20px}
.dots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dots i{height:4px;border-radius:9px;background:var(--track)}
.dots i.on{background:var(--ink)}
.bigt{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.08;margin:0}
.region{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left}
.region .fl{font-size:26px}
.region .rad{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.region.on .rad{border:7px solid var(--green)}
.inp{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}


/* Colour themes: white, light pink, pink, dark pink */
:root[data-theme="white"]{
  --bg:#FFFFFF; --panel:#F4F4F6; --card:#FFFFFF; --line:#E9E9EC; --track:#EEEEF1;
  --text:#141415; --muted:#85858B; --ink:#141415; --on-ink:#FFFFFF; --bar:#2A2A2C; --bar2:#3A3A3D;
  --green-soft:#DDF5DD; --red-soft:#FCE3E4; --hero1:#2D2D30; --hero2:#111113; color-scheme:light;
}
:root[data-theme="lightpink"]{
  --bg:#FCEEF3; --panel:#FFF6F9; --card:#FFFFFF; --line:#F5DCE6; --track:#F8E4EC;
  --text:#2B1520; --muted:#9A7886; --ink:#3B1A2B; --on-ink:#FFFFFF; --bar:#D9548C; --bar2:#E7759F;
  --green-soft:#DDF5DD; --red-soft:#FCE3E4; --hero1:#EC7EAA; --hero2:#C94C80; color-scheme:light;
  --tab-bg:#3B1A2B; --tab-on-fg:#C94C80;
}
:root[data-theme="pink"]{
  --bg:#F6C3D6; --panel:#FAD8E5; --card:#FFF4F8; --line:#EDB6CB; --track:#F2C9D8;
  --text:#3A0F26; --muted:#8B4F6B; --ink:#B21E5C; --on-ink:#FFFFFF; --bar:#B21E5C; --bar2:#C93A75;
  --green-soft:#DDF5DD; --red-soft:#FCE3E4; --hero1:#E2468A; --hero2:#A3184F; color-scheme:light;
  --tab-bg:#A3184F; --tab-on-fg:#A3184F;
}
:root[data-theme="darkpink"]{
  --bg:#1C0A13; --panel:#2A111E; --card:#341626; --line:#4A2138; --track:#4A2138;
  --text:#FCE8F1; --muted:#C48AA5; --ink:#FF5DA2; --on-ink:#1C0A13; --bar:#FF5DA2; --bar2:#E0458A;
  --green-soft:#173A17; --red-soft:#3A1718; --hero1:#9E1F5C; --hero2:#4E0C2D; color-scheme:dark;
  --tab-bg:#0F050A; --tab-on-bg:#FF5DA2; --tab-on-fg:#1C0A13;
}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 0}
.swatch{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.swatch i{width:44px;height:44px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:block;position:relative;overflow:hidden}
.swatch i b{position:absolute;right:0;bottom:0;width:50%;height:50%;border-top-left-radius:100%}
.swatch.on{color:var(--text)}
.swatch.on i{outline:2.5px solid var(--text);outline-offset:3px}

/* ---------- Motion & graphics ---------- */
@keyframes rise{from{transform:translateY(14px);opacity:.35}}
@keyframes grow{from{transform:scaleY(.05)}}
@keyframes fillx{from{transform:scaleX(0)}}
@keyframes ringIn{from{stroke-dashoffset:100}}
@keyframes draw{from{stroke-dashoffset:1}}
@keyframes shine{0%{transform:translateX(-120%)}22%,100%{transform:translateX(120%)}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-18px,12px) scale(1.12)}}
@keyframes livering{0%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 0 rgba(45,181,45,.55)}100%{box-shadow:0 4px 10px rgba(0,0,0,.45),0 0 0 14px rgba(45,181,45,0)}}
.enter > .stack > *, .enter > .stack, .ob.enter .obbody > *{animation:rise .55s cubic-bezier(.16,1,.3,1) both}
.enter > .stack > *:nth-child(2), .ob.enter .obbody > *:nth-child(2){animation-delay:.04s}
.enter > .stack > *:nth-child(3), .ob.enter .obbody > *:nth-child(3){animation-delay:.08s}
.enter > .stack > *:nth-child(4), .ob.enter .obbody > *:nth-child(4){animation-delay:.12s}
.enter > .stack > *:nth-child(5), .ob.enter .obbody > *:nth-child(5){animation-delay:.16s}
.enter > .stack > *:nth-child(6), .ob.enter .obbody > *:nth-child(6){animation-delay:.2s}
.enter > .stack > *:nth-child(n+7){animation-delay:.24s}
.enter > .stack{animation:none}
.enter .list > *{animation:rise .5s cubic-bezier(.16,1,.3,1) both}
.enter .list > *:nth-child(2){animation-delay:.05s}.enter .list > *:nth-child(3){animation-delay:.1s}.enter .list > *:nth-child(4){animation-delay:.15s}.enter .list > *:nth-child(n+5){animation-delay:.2s}
.bar{transform-origin:bottom}
.enter .bar{animation:grow .9s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 55ms + .15s)}
.progress i{transform-origin:left}
.enter .progress i{animation:fillx 1.1s cubic-bezier(.16,1,.3,1) both .2s}
.hero .glow{position:absolute;width:220px;height:220px;right:-60px;top:-90px;border-radius:50%;background:radial-gradient(circle,var(--glow,rgba(255,255,255,.12)),transparent 70%);animation:drift 9s ease-in-out infinite;pointer-events:none}
.hero .shine{position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.07) 48%,transparent 60%);animation:shine 8s ease-in-out infinite 1.5s;pointer-events:none}
.act .ball.live{animation:livering 1.6s ease-out infinite}
.spark{width:100%;height:auto;display:block;overflow:visible}
.enter .spark-line{stroke-dasharray:1;animation:draw 1.2s cubic-bezier(.16,1,.3,1) both .25s}
.ring{position:relative;width:64px;height:64px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring-track{fill:var(--card);stroke:var(--track);stroke-width:5}
.ring-bar{fill:none;stroke:var(--c);stroke-width:5;stroke-linecap:round;stroke-dasharray:100}
.enter .ring-bar{animation:ringIn 1.2s cubic-bezier(.16,1,.3,1) both .2s}
.ring .ico{width:24px;height:24px}
.empty .art{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:radial-gradient(circle at 30% 25%,var(--card),var(--track));box-shadow:inset 0 0 0 1px var(--line),0 10px 24px -14px rgba(0,0,0,.35);margin-bottom:4px}
.empty .art .ico{width:30px;height:30px}
.shift,.panel.goal,.inv-row,.paycard,.choice,.region,.qa button{transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.shift:active,.panel.goal:active,.inv-row:active,.paycard:active,.choice:active,.region:active,.qa button:active{transform:scale(.975)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.help p{margin:0 0 8px}.help p:last-child{margin:0}
:root[data-theme="lightpink"],:root[data-theme="pink"]{--glow:rgba(255,255,255,.28)}
:root[data-theme="darkpink"]{--glow:rgba(255,93,162,.35)}

/* v5: account, passcode, calendar, payslip */
.acct{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.acct .st{flex:none;gap:4px}
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.pindots{display:flex;gap:16px;margin:18px 0 10px}
.pindots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);transition:background .15s,transform .15s}
.pindots i.on{background:var(--ink);transform:scale(1.1)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px 22px;margin:8px 0}
.keypad button{width:72px;height:72px;border-radius:50%;background:var(--panel);font-size:26px;font-weight:600;display:grid;place-items:center;transition:transform .12s,background .12s}
.keypad button:active{transform:scale(.92);background:var(--track)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cwd{text-align:center;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.cday{aspect-ratio:1/1.15;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 2px 4px;gap:3px;min-width:0;border:1px solid transparent}
.cday b{font-size:13px;font-weight:600}
.cday.today b{background:var(--ink);color:var(--on-ink);border-radius:99px;padding:0 6px}
.cday.sel{border-color:var(--ink)}
.cday.fut{background:transparent;border:1px dashed var(--line)}
.cday.sel.fut{border:1px solid var(--ink)}
.cdots{display:flex;gap:2px}.cdots i{width:5px;height:5px;border-radius:50%}
.camt{font-size:9.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;max-width:100%}
.verdict{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-size:14px}
.verdict.ok{background:var(--green-soft);color:var(--green)}
.verdict.under{background:var(--red-soft);color:var(--red)}
.verdict.over{background:#E3E9FE;color:#3550D8}
:root[data-theme="dark"] .verdict.over,:root[data-theme="darkpink"] .verdict.over{background:#1B2350;color:#9DB0FF}

.cday{aspect-ratio:auto;min-height:64px}
.cday.has{background:var(--card)}
.ctime{font-size:9px;color:var(--muted);white-space:nowrap;line-height:1}
.camt{font-size:10px;font-weight:600;color:var(--text)}
.cday.fut .camt{color:var(--muted);font-weight:500}
.cday:not(.has){background:transparent;border:1px solid var(--line)}
.cday.sel{border:1.5px solid var(--ink)!important;background:var(--card)}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.legend i.dash{border:1px dashed var(--muted);border-radius:3px;width:10px;height:8px}
.f>span:first-child{flex:0 1 auto;min-width:0;line-height:1.3;padding:6px 0}
.f .toggle{flex:none}
.f select{min-width:0;max-width:62%}
html,body{overflow-x:hidden}

.contract{margin-bottom:8px}
.cday{position:relative}
.cday.off{opacity:.45}
.cmark{position:absolute;top:-1px;left:50%;transform:translateX(-50%);font-size:7.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:0 4px;border-radius:0 0 5px 5px;background:var(--c);color:#fff;line-height:1.5}
.cmark.end{background:var(--red)}

/* final pass */
input,select,textarea{font-size:16px!important}
.f input,.f select{font-size:16px!important}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;color:var(--text);padding:12px 0;font:inherit;min-width:0}
.search input::-webkit-search-cancel-button{opacity:.6}
.paycard.remind{border:1.5px solid var(--green);background:var(--card)}
.paycard.remind .btn{flex:none}

.cday.wkedit::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.rentry input[type=time]{min-width:118px}
.avedit{position:relative;display:inline-grid;cursor:pointer;flex:none;border-radius:50%;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.avedit:active{transform:scale(.95)}
.avedit .cam{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;border:2px solid var(--card);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.avedit .cam svg{width:12px;height:12px}
.photo-pick{display:flex;align-items:center;gap:16px;padding:14px 16px;background:var(--card);border-radius:20px}
/* v3 additions: invoices, roster, payday, onboarding */
.paycard{display:flex;align-items:center;gap:12px;background:var(--panel);border-radius:20px;padding:14px;width:100%;text-align:left}
.paycard .tile{color:var(--blue)}
.paycard b{font-size:15px}
.paycard .amt{margin-left:auto;text-align:right}
.paycard .amt b{display:block;font-variant-numeric:tabular-nums}
.st{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--track);color:var(--muted)}
.st.sent{background:#E3E9FE;color:#3550D8}
.st.paid{background:var(--green-soft);color:var(--green)}
.st.overdue{background:var(--red-soft);color:var(--red)}
:root[data-theme="dark"] .st.sent,:root[data-theme="darkpink"] .st.sent{background:#1B2350;color:#9DB0FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.sent{background:#1B2350;color:#9DB0FF}}
.inv-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;width:100%;text-align:left}
.inv-row .mid{flex:1;min-width:0}
.inv-row .mid b{display:block;font-size:15px}
.inv-row .mid span{font-size:13px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-row .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.inv-row .right b{font-variant-numeric:tabular-nums}
/* Invoice paper is always light, like the printed page */
.paper{background:#fff;color:#1a1a1a;border-radius:14px;padding:20px 18px;font-size:11.5px;line-height:1.45;box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px -12px rgba(0,0,0,.25);border:1px solid #e6e6e8}
.paper h3{margin:0;font-size:20px;letter-spacing:.08em}
.paper .pm{color:#777}
.paper .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.paper .lab{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:#888;font-weight:700;margin-bottom:3px}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper th{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:#888;text-align:left;padding:6px 4px;border-bottom:1.5px solid #1a1a1a}
.paper td{padding:6px 4px;border-bottom:1px solid #eee;vertical-align:top}
.paper td.r,.paper th.r{text-align:right;white-space:nowrap}
.paper tr.sub td{color:#2a8a2a;border-bottom:1px dashed #eee;padding-top:2px}
.paper .tot{margin-left:auto;width:60%;margin-top:10px}
.paper .tot div{display:flex;justify-content:space-between;padding:3px 4px}
.paper .tot .big{font-size:15px;font-weight:800;border-top:1.5px solid #1a1a1a;margin-top:4px;padding-top:7px}
.paper .pay{margin-top:16px;padding:10px 12px;background:#f5f5f7;border-radius:10px}
.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daygrid button{padding:12px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:13px}
.daygrid button.on{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.rday{display:flex;flex-direction:column;gap:6px}
.rday .dh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px;padding:0 4px}
.rentry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.rentry .f{min-height:42px}
.rentry input[type="time"]{max-width:100px}
.choice{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;width:100%;text-align:left}
.choice .tile{flex:none}
.choice .rad{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.choice.on{border-color:var(--ink)}
.choice.on .rad{border:7px solid var(--green)}
.choice b{display:block;font-size:15px}
.choice span.s{font-size:13px;color:var(--muted)}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px;border:1.5px dashed var(--line);border-radius:16px;background:var(--card);text-align:center;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop img{max-height:160px;max-width:100%;border-radius:10px}
.found{display:flex;flex-direction:column;gap:8px}
.found .fi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.found .fi.off{opacity:.45}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--track);border-top-color:var(--ink);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--blue)}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:18px;padding:14px;font-weight:600;font-size:14px;text-align:left}
.qa button .tile{width:34px;height:34px;border-radius:10px}
