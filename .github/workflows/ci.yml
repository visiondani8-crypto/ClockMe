# Runs on every push and pull request. A red run means: do not merge to main.
name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build check, unit and end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # same as the Vercel project
          cache: npm
      - run: npm ci
      - name: Committed build matches src/
        run: npm run build:check
      - name: Unit tests
        run: npm run test:unit
      - name: Install Chromium and WebKit (Safari's engine) for Playwright
        run: npx playwright install --with-deps chromium webkit
      - name: End-to-end, accessibility and responsive tests (Chrome, Mac Safari, iPhone Safari)
        run: npm run test:e2e
        env:
          PW_WEBKIT: "1"
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  audit:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: Run gitleaks 8.30.1
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          F="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL -o "$F" "$BASE/$F"
          curl -sSfL -o checksums.txt "$BASE/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $F$" checksums.txt | sha256sum -c -
          tar -xzf "$F" gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
